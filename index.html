    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Check if running on localhost / dev environment
      const isDevHost = Boolean(
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1' ||
        window.location.hostname === '[::1]'
      );

      // Configure GA4 with beacon transport so SPA tab/route navigation survives page lifecycle
      gtag('config', 'G-S4F4KR5CXQ', {
        transport_type: 'beacon',
        send_page_view: !isDevHost,
        debug_mode: isDevHost,
      });

      // Defer external GTM script download to idle time to unblock critical path & React hydration
      if (!isDevHost) {
        const loadGtagScript = () => {
          if (document.getElementById('gtag-script')) return;
          const script = document.createElement('script');
          script.id = 'gtag-script';
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-S4F4KR5CXQ';
          document.head.appendChild(script);
        };

        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadGtagScript, { timeout: 3000 });
        } else {
          window.addEventListener('load', () => setTimeout(loadGtagScript, 1000));
        }
      }
    </script>
